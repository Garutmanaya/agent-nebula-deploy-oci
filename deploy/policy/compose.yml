services:
  nebula-policy:
    image: ${ANU_DEPLOY_POLICY_IMAGE}
    restart: unless-stopped
    init: true
    user: "${ANU_CONTAINER_UID}:${ANU_CONTAINER_GID}"
    ports:
      - "${ANU_POLICY_PORT}:${ANU_POLICY_PORT}"
    environment:
      ANU_HOME: ${ANU_HOME}
      ANU_RUNTIME_HOME: ${ANU_RUNTIME_HOME}
      ANU_INSTANCE_ROOT: ${ANU_HOME}/${ANU_POLICY_INSTANCE}
      ANU_INSTANCE_RUNTIME_ROOT: ${ANU_RUNTIME_HOME}/${ANU_POLICY_INSTANCE}
      ANU_DEPLOYMENT_PROFILE: ${ANU_DEPLOYMENT_PROFILE}
      ANU_RUNTIME_MODE: ${ANU_RUNTIME_MODE}
    volumes:
      - ${ANU_HOME}/${ANU_POLICY_INSTANCE}/certs:${ANU_HOME}/${ANU_POLICY_INSTANCE}/certs:ro
      - ${ANU_HOME}/nebula-ca/certs:${ANU_HOME}/nebula-ca/certs:ro
      - ${ANU_HOME}/${ANU_POLICY_INSTANCE}/data:${ANU_HOME}/${ANU_POLICY_INSTANCE}/data:rw
      - ${ANU_HOME}/${ANU_POLICY_INSTANCE}/logs:${ANU_HOME}/${ANU_POLICY_INSTANCE}/logs:rw
      - ${ANU_HOME}/${ANU_POLICY_INSTANCE}/tmp:${ANU_HOME}/${ANU_POLICY_INSTANCE}/tmp:rw
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('https://localhost:${ANU_POLICY_PORT}/health/ready',context=__import__('ssl').create_default_context(cafile='${ANU_HOME}/nebula-ca/certs/${ANU_ROOT_CA_FILENAME}'),timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
